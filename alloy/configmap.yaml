apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: config
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/version: v1.18.1
  name: alloy
  namespace: monitoring-system
data:
  config.alloy: |-
    loki.write "push" {
      endpoint {
        url = "http://mon.ctas-dev.intranet.pajak.go.id:3100/loki/api/v1/push"
      }
    }

    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role = "pod"
        field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "^monitoring-system$"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        action        = "replace"
        target_label  = "node"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_controller_kind"]
        action        = "replace"
        target_label  = "controller_kind"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        action        = "replace"
        target_label  = "controller_name"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }

      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_container_name",
        ]
        action        = "replace"
        target_label  = "job"
        separator     = "/"
        replacement   = "$1"
      }

      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_name",
          "__meta_kubernetes_pod_uid",
          "__meta_kubernetes_pod_container_name",
        ]
        action        = "replace"
        target_label  = "path"
        separator     = "_"
        regex         = "(.+)_(.+)"
        replacement   = "/var/log/pods/$1/$2/*.log"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        action        = "replace"
        target_label  = "container_runtime"
        regex         = "^(\\S+):\\/\\/.+$"
        replacement   = "$1"
      }

      rule {
        action        = "replace"
        target_label  = "job"
        replacement   = "kube-pod-logs"
      }
    }

    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.static_labels {
        values = {
          cluster = "k8s-djp-ctas-development",
        }
      }
      forward_to = [loki.write.push.receiver]
    }
