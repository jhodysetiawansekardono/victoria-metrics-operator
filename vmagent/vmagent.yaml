apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/part-of: victoria-metrics-stack
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: 1.148.0
  name: scraping
  namespace: monitoring-system
spec:
  extraArgs:
    promscrape.maxScrapeSize: "50MB"
    loggerTimezone: "Asia/Jakarta"
  dnsConfig:
    options:
    - name: ndots
      value: "0"
  externalLabels:
    cluster: YOUR_CLUSTER_NAME
  image:
    repository: victoriametrics/vmagent
    tag: v1.148.0
    pullPolicy: IfNotPresent
  nodeSelector:
    node-role.kubernetes.io/monitoring: "true"
  podMetadata:
    annotations:
      kubectl.kubernetes.io/default-container: vmagent
    labels:
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/name: vmagent
      app.kubernetes.io/part-of: victoria-metrics-stack
      app.kubernetes.io/managed-by: victoria-metrics-operator
      app.kubernetes.io/version: 1.148.0
  remoteWrite:
    - url: "http://vmsingle-tsdb.monitoring-system.svc.cluster.local:8429/api/v1/write"
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "350Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  serviceSpec:
    metadata:
      labels:
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/name: vmagent
        app.kubernetes.io/part-of: victoria-metrics-stack
        app.kubernetes.io/managed-by: victoria-metrics-operator
    spec:
      ports:
      - name: http
        nodePort: 30429
        port: 8429
        targetPort: 8429
      selector:
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/name: vmagent
        app.kubernetes.io/part-of: victoria-metrics-stack
      type: NodePort
    useAsDefault: true
  scrapeInterval: 30s
  selectAllByDefault: true
  tolerations:
  - operator: Exists
