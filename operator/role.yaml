apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/part-of: victoria-metrics-stack
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: 0.74.1
  name: victoria-metrics-operator
  namespace: monitoring-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
