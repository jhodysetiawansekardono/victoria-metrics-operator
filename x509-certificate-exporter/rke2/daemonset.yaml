apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: x509-certificate-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: 4.2.0
  name: x509-certificate-exporter
  namespace: monitoring-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: x509-certificate-exporter
      app.kubernetes.io/part-of: observability
  template:
    metadata:
      annotations:
        prometheus.io/port: "9793"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: x509-certificate-exporter
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: 4.2.0
    spec:
      containers:
      - args:
        - --listen-address=:9793
        - --watch-file=/var/lib/rancher/rke2/agent/client-kube-proxy.crt
        - --watch-file=/var/lib/rancher/rke2/agent/client-kubelet.crt
        - --watch-file=/var/lib/rancher/rke2/agent/client-rke2-controller.crt
        - --watch-file=/var/lib/rancher/rke2/agent/serving-kubelet.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-admin.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-auth-proxy.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-controller.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-kube-apiserver.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-rke2-cloud-controller.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-scheduler.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/client-supervisor.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/serving-kube-apiserver.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/etcd/client.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/etcd/peer-server-client.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/kube-controller-manager/kube-controller-manager.crt
        - --watch-file=/var/lib/rancher/rke2/server/tls/kube-scheduler/kube-scheduler.crt
        image: docker.io/enix/x509-certificate-exporter:4.2.0
        imagePullPolicy: IfNotPresent
        name: x509-certificate-exporter
        ports:
        - containerPort: 9793
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 40Mi
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/rancher/rke2/server/tls/
          name: server-certs
          readOnly: true
        - mountPath: /var/lib/rancher/rke2/agent/
          name: agent-certs
          readOnly: true
      dnsConfig:
        options:
        - name: ndots
          value: "0"
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      serviceAccount: x509-certificate-exporter
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/rancher/rke2/server/tls/
          type: Directory
        name: server-certs
      - hostPath:
          path: /var/lib/rancher/rke2/agent/
          type: Directory
        name: agent-certs
